<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>生产 Session JS 桥测试</title>
<style>body{font:16px system-ui;background:#15232c;color:#e5f1ee;max-width:1000px;margin:20px auto}button,input{font:inherit;margin:5px;padding:8px}pre{white-space:pre-wrap;max-height:500px;overflow:auto;background:#07121c;padding:15px}</style>
<h1>生产 Session 桥 · 完整 World 测试</h1><p>直接加载生产 JS；仅独立 test 数据库。没有 WebGL，不冒称已验证 Godot JavaScriptBridge。</p>
<p id="context"></p><label>租约毫秒 <input id="ttl" value="1000" type="number"></label>
<button id="claim">获取写权限</button><button id="read">读取当前完整存档</button><br>
<button id="create">创建真实 A 新局</button><button id="retry_create">重复同请求创建 A</button><button id="save">保存 A 合法一步</button><button id="retry_save">重复同一步请求</button><button id="replace">明确替换为真实 B</button><br>
<button id="settle">确认退役当前测试旅程</button><br>
<button id="risk_setup">创建真实26步风险测试局</button><button id="death">确认当前测试致死战斗</button><br>
<button id="selftest">独立随机库生产桥自动测试</button><pre id="log">准备中…</pre>
<script>
const query=new URL(location.href).searchParams;window.MagicTowerJourneysTestDatabase=query.get('db')||'magic-tower-journeys-v1-test-manual';
</script><script src="session_storage_runtime.js"></script>
<script>
(async()=>{
 const fixtures=await (await fetch('session_bridge_fixtures.json')).json();
 const owner=crypto.randomUUID();let auth,slot=0,revision=0,serial=0,lastReply=null;
 const id=fixtures.first.run_id;const saveId='cccccccccccccccccccccccccccccccc';
 const log=value=>document.querySelector('#log').textContent=JSON.stringify(value,null,2);
 const rpc=(operation,args={})=>new Promise((resolve,reject)=>{const request=++serial;const timeout=setTimeout(()=>reject(Error('HARNESS_TIMEOUT')),10000);MagicTowerJourneys.request(JSON.stringify({request,operation,args}),encoded=>{const answer=JSON.parse(encoded);lastReply=answer.result;clearTimeout(timeout);if(answer.request!==request)reject(Error('REQUEST_MISMATCH'));else resolve(answer.result)})});
 const short=r=>r.run?{...r,run:{...r.run,snapshot:{...r.run.snapshot,floors:`${r.run.snapshot.floors?.length} complete maps retained; omitted only from display`}}}:r;
 const click=(id,fn)=>document.querySelector(id).onclick=async()=>{try{log(short(await fn()))}catch(e){log({error:e.message})}};
 document.querySelector('#context').textContent='DB: '+MagicTowerJourneys.databaseName+' / owner '+owner;
 click('#claim',async()=>{const r=await rpc('claim',{owner,lease_ms:Number(document.querySelector('#ttl').value)});if(r.ok){auth=r.auth;slot=auth.expectedSlotRevision}return r});
 click('#read',async()=>{const r=await rpc('read');if(r.ok){slot=r.slotRevision;revision=r.run?.revision||0}return r});
 const createA=async()=>{const r=await rpc('create',{auth,snapshot:fixtures.first,replace:false,request_id:id});if(r.ok){slot=r.slotRevision;revision=r.run.revision;auth.expectedSlotRevision=slot}return r};
 click('#create',createA);click('#retry_create',createA);
 const saveA=()=>rpc('save',{auth:{...auth,expectedSlotRevision:1},id,expected:0,snapshot:fixtures.first_after_step,request_id:saveId});
 click('#save',saveA);click('#retry_save',saveA);
 click('#replace',async()=>{const r=await rpc('create',{auth:{...auth,expectedSlotRevision:slot},snapshot:fixtures.second,replace:true,request_id:fixtures.second.run_id});if(r.ok){slot=r.slotRevision;auth.expectedSlotRevision=slot}return r});
 let manualFinishArgs=null;
 click('#settle',async()=>{
  if(!manualFinishArgs){
   const current=await rpc('read');if(!current.ok||!current.run)return current;
   const base=current.run.snapshot;const ended=structuredClone(base);ended.ended_reason='retired';
   manualFinishArgs={auth:{...auth,expectedSlotRevision:current.slotRevision},id:current.run.id,expected:current.run.revision,outcome:'withdrawn',request_id:crypto.randomUUID().replaceAll('-',''),base,ended};
  }
  const result=await rpc('settle',manualFinishArgs);
  if(result.ok){slot=result.slotRevision;auth.expectedSlotRevision=slot}return result;
 });
 click('#risk_setup',async()=>{
  const created=await rpc('create',{auth,snapshot:fixtures.risk_fresh,replace:true,request_id:fixtures.risk_fresh.run_id});
  if(!created.ok)return created;auth.expectedSlotRevision=created.slotRevision;slot=created.slotRevision;
  return await rpc('save',{auth,id:fixtures.risk_fresh.run_id,expected:0,snapshot:fixtures.risk_base,request_id:'manual_risk_route_save_01'});
 });
 let manualDeathArgs=null;
 click('#death',async()=>{
  if(!manualDeathArgs){
   const current=await rpc('read');if(!current.ok||!current.run)return current;
   manualDeathArgs={auth:{...auth,expectedSlotRevision:current.slotRevision},id:current.run.id,expected:current.run.revision,delta:fixtures.risk_delta,request_id:crypto.randomUUID().replaceAll('-',''),base:current.run.snapshot,ended:fixtures.risk_dead};
  }
  const result=await rpc('death',manualDeathArgs);
  if(result.ok){slot=result.slotRevision;auth.expectedSlotRevision=slot}return result;
 });
 click('#selftest',async()=>{
  // A fresh same-origin page creates an isolated production test namespace.
  const testDB='magic-tower-journeys-v1-test-auto-'+crypto.randomUUID();
  const iframe=document.createElement('iframe');iframe.style.display='none';iframe.src='session_storage_harness.html?db='+testDB+'&auto=1';document.body.append(iframe);
  return await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('SELFTEST_TIMEOUT')),20000);const listener=e=>{if(e.source===iframe.contentWindow&&e.data?.type==='session-results'){clearTimeout(timer);removeEventListener('message',listener);resolve(e.data.result);iframe.remove()}};addEventListener('message',listener)});
 });
 if(query.get('auto')==='1'){
  const checks=[];const check=(value,label)=>{if(!value)throw Error('FAIL '+label);checks.push(label)};
  const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  try{
   let r=await rpc('claim',{owner,lease_ms:60000});check(r.ok,'claim global writer');auth=r.auth;
   const created=await rpc('create',{auth,snapshot:fixtures.first,replace:false,request_id:id});check(created.ok&&eq(created.run.snapshot,fixtures.first),'create full real World payload');
   const dupCreate=await rpc('create',{auth,snapshot:fixtures.first,replace:false,request_id:id});check(dupCreate.ok&&dupCreate.duplicate&&dupCreate.run.id===id&&dupCreate.run.revision===0,'lost-create-ack retry stable identity');auth.expectedSlotRevision=created.slotRevision;
   const saved=await saveA();check(saved.ok&&saved.run.revision===1&&eq(saved.run.snapshot,fixtures.first_after_step),'save full legal step and complete map/gear data');
   const dupSave=await saveA();check(dupSave.ok&&dupSave.duplicate&&dupSave.run.revision===1,'lost-save-ack retry no double step');
   const bad=structuredClone(fixtures.first_after_step);bad.run_id=fixtures.second.run_id;
   r=await rpc('save',{auth,id,expected:1,snapshot:bad,request_id:'dddddddddddddddddddddddddddddddd'});check(!r.ok&&r.code==='IDENTITY_MISMATCH','reject identity graft');
   r=await rpc('save',{auth,id,expected:0,snapshot:fixtures.first,request_id:'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee'});check(!r.ok&&r.code==='STALE_REVISION','reject stale revision');
   r=await rpc('read');check(r.ok&&eq(r.run.snapshot,fixtures.first_after_step),'read retains all World fields');
   const replacement=await rpc('create',{auth,snapshot:fixtures.second,replace:true,request_id:fixtures.second.run_id});check(replacement.ok&&replacement.slotRevision===2,'explicit replacement only once');
   r=await saveA();check(!r.ok&&r.code==='SUPERSEDED_OPERATION','old retry cannot reactivate abandoned run');
   auth.expectedSlotRevision=2;r=await rpc('renew',{auth,lease_ms:60});check(r.ok,'short lease for expiry test');await new Promise(r=>setTimeout(r,100));
   const takeover=await rpc('claim',{owner:'other-owner-'+owner,lease_ms:60000});check(takeover.ok&&takeover.auth.fence>auth.fence,'new fence after real expiry');
   r=await rpc('create',{auth,snapshot:fixtures.first,replace:true,request_id:id});check(!r.ok&&r.code==='STALE_WRITER','old fence cannot replace new active run');
   r=await rpc('read');check(r.ok&&eq(r.run.snapshot,fixtures.second),'latest active payload stays exact');
   auth=takeover.auth;
   const finishArgs={auth:{...auth},id:fixtures.second.run_id,expected:0,outcome:'withdrawn',request_id:'ffffffffffffffffffffffffffffffff',base:fixtures.second,ended:fixtures.second_ended};
   for(const point of ['before_writes','after_profile','after_receipt','after_archive','after_slot']){
    r=await rpc('settle',{...finishArgs,test_abort:point});check(!r.ok&&r.code==='INJECTED_ABORT_'+point,'settlement abort '+point);
    r=await rpc('read');check(r.ok&&r.slotRevision===2&&r.run.revision===0&&eq(r.run.snapshot,fixtures.second)&&Object.keys(r.profile.receipts).length===0,'atomic rollback '+point);
   }
   const changed=structuredClone(fixtures.second_ended);changed.gold+=1;
   r=await rpc('settle',{...finishArgs,ended:changed});check(!r.ok&&r.code==='INVALID_END_TRANSITION','cannot grant arbitrary reward through ended candidate');
   const staleBase=structuredClone(fixtures.second);staleBase.gold+=1;
   const staleEnd=structuredClone(fixtures.second_ended);staleEnd.gold+=1;
   r=await rpc('settle',{...finishArgs,base:staleBase,ended:staleEnd});check(!r.ok&&r.code==='STALE_BASE','full prepared base is checked inside transaction');
   r=await rpc('settle',{...finishArgs,outcome:'victory'});check(!r.ok,'cannot claim false victory');
   const finished=await rpc('settle',finishArgs);check(finished.ok&&finished.run.status==='archived'&&finished.run.revision===1&&finished.slotRevision===3&&eq(finished.run.snapshot,fixtures.second_ended),'one atomic full-world settlement');
   check(finished.receipt.summary.max_floor===1&&finished.receipt.summary.outcome==='withdrawn'&&Object.keys(finished.profile.receipts).length===1,'receipt derived from actual base');
   r=await rpc('settle',finishArgs);check(r.ok&&r.duplicate&&eq(r.receipt,finished.receipt)&&r.slotRevision===3,'lost settlement response retries once');
   r=await rpc('read');check(r.ok&&r.run.status==='archived'&&eq(r.receipt,finished.receipt)&&eq(r.profile,finished.profile),'archived restart read includes receipt and full ledger');
   auth.expectedSlotRevision=3;
   r=await rpc('create',{auth,snapshot:fixtures.winner_fresh,replace:true,request_id:fixtures.winner_fresh.run_id});check(r.ok&&Object.keys(r.profile.receipts).length===1,'new active run preserves ledger');
   r=await rpc('settle',finishArgs);check(!r.ok&&r.code==='SUPERSEDED_OPERATION','old finished request cannot revive superseded journey');
   auth.expectedSlotRevision=4;
   r=await rpc('create',{auth,snapshot:fixtures.risk_fresh,replace:true,request_id:fixtures.risk_fresh.run_id});check(r.ok&&r.run.snapshot.mode==='risk','create explicit risk journey');auth.expectedSlotRevision=r.slotRevision;
   r=await rpc('save',{auth,id:fixtures.risk_fresh.run_id,expected:0,snapshot:fixtures.risk_base,request_id:'risk_legal_route_save_0001'});check(r.ok,'persist real 26-step risk route');
   const deathArgs={auth:{...auth},id:fixtures.risk_base.run_id,expected:1,delta:fixtures.risk_delta,request_id:'risk_death_request_000001',base:fixtures.risk_base,ended:fixtures.risk_dead};
   for(const point of ['before_writes','after_profile','after_receipt','after_archive','after_slot']){
    r=await rpc('death',{...deathArgs,test_abort:point});check(!r.ok&&r.code==='INJECTED_ABORT_'+point,'death abort '+point);
    r=await rpc('read');check(r.ok&&r.slotRevision===5&&r.run.revision===1&&eq(r.run.snapshot,fixtures.risk_base)&&Object.keys(r.profile.receipts).length===1,'death rollback preserves full living state '+point);
   }
   r=await rpc('save',{auth,id:deathArgs.id,expected:1,snapshot:fixtures.risk_dead,request_id:'risk_forbidden_dead_save_01'});check(!r.ok,'death cannot bypass atomic archive with ordinary save');
   r=await rpc('settle',{...deathArgs,outcome:'defeat'});check(!r.ok,'generic settlement cannot invent defeat');
   const illicit=structuredClone(fixtures.risk_dead);illicit.gold+=100;
   r=await rpc('death',{...deathArgs,ended:illicit});check(!r.ok&&r.code==='INVALID_END_TRANSITION','death grants no enemy gold or unrelated changes');
   const died=await rpc('death',deathArgs);check(died.ok&&died.run.status==='archived'&&died.slotRevision===6&&died.run.revision===2&&eq(died.run.snapshot,fixtures.risk_dead),'atomic full death candidate and ledger');
   check(died.receipt.summary.outcome==='defeat'&&died.receipt.summary.moves===fixtures.risk_base.moves+1,'defeat summary from actual fatal attempt');
   r=await rpc('death',deathArgs);check(r.ok&&r.duplicate&&eq(r.receipt,died.receipt)&&r.slotRevision===6,'death lost ack retry no duplicate grant');
   r=await rpc('death',{...deathArgs,delta:[0,1]});check(!r.ok,'changed lethal direction cannot replay old receipt');
   r=await rpc('read');check(r.ok&&eq(r.run.snapshot,fixtures.risk_dead)&&eq(r.receipt,died.receipt),'death restart read retains exact record and receipt');
   auth.expectedSlotRevision=6;
   r=await rpc('create',{auth,snapshot:fixtures.next_fresh,replace:true,request_id:fixtures.next_fresh.run_id});check(r.ok&&Object.keys(r.profile.receipts).length===2,'new safe run preserves prior death ledger');
   r=await rpc('death',deathArgs);check(!r.ok&&r.code==='SUPERSEDED_OPERATION','old death cannot reactivate newer journey');
   parent.postMessage({type:'session-results',result:{PASS:true,count:checks.length,checks,database:window.MagicTowerJourneysTestDatabase,scope:'Production JS callback protocol + real IndexedDB, not Godot WebGL/JavaScriptBridge runtime'}},location.origin);
  }catch(e){parent.postMessage({type:'session-results',result:{PASS:false,error:e.message,lastReply,checks,database:window.MagicTowerJourneysTestDatabase}},location.origin)}
 }
 log({ready:true,database:MagicTowerJourneys.databaseName});
})();
</script></html>
