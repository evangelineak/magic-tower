name: Publish verified reversible water exploration at original homepage
on:
  push:
    branches: ['pages/playtest']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: magic-tower-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install checksum-verified official Godot and single-thread Web template
        shell: bash
        run: |
          set -euo pipefail
          fetch_asset() {
            if ! curl --fail --location --connect-timeout 20 --max-time 300 --retry 2 -H 'Accept: application/octet-stream' -o "$2" "https://api.github.com/repos/godotengine/godot-builds/releases/assets/$1"; then
              curl --fail --location --connect-timeout 20 --max-time 300 --retry 2 -o "$2" "$3"
            fi
          }
          fetch_asset 425484901 /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          echo 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo 'GODOT_BIN=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64' >> "$GITHUB_ENV"
          fetch_asset 425482597 /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          echo '3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8  /tmp/templates.tpz' | sha256sum --check
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -p /tmp/templates.tpz templates/web_nothreads_release.zip > "$HOME/.local/share/godot/export_templates/4.6.3.stable/web_nothreads_release.zip"
      - name: Verify and export reversible water exploration release
        run: |
          bash tools/test_all.sh
          mkdir -p export/next
          "$GODOT_BIN" --headless --path . --export-release 'Web Single Thread' export/next/index.html
          cp assets/fonts/LICENSE-OFL.txt export/next/FONT-LICENSE.txt
          "$GODOT_BIN" --headless --path . --script tools/export_license.gd -- export/next/GODOT-LICENSES.txt
          printf 'Magic Tower verified endless twin-pool exploration release\nGame source: 6ea147185994b1e4473b3a8a0fdab4a31d958134\nWeb deployment source: %s\nFinal world 8d0e938ac74d1c0db41d3468ea9ce9957699cef813dd6e31f92aee2d8d7a136c; generator ba8f12fa2be869302e96fbb8838ae83b1cae6e37355435f849e7203e447c998c. Version22 new journeys: one water floor per8-floor block, reversible dry/deep pools, three adjacent shore/island valves, dry one-guardian route or two-guardian island route, existing strong-guard relic relocated not duplicated. No drowning timer or hidden random damage. Seed-mix correlation corrected and finite distribution checked. Old rules1-21 frozen; N required for new22. Hero-specific cosmetic battle effects with honest single-settlement notice, not per-hit replay.\nAll118 Godot suites plus Node, independent cart and water gates passed. Core5291 checks/eight legal100-floor policies. Independent128 generated water maps, all reachable state components and8 broken-map mutants, four earned journeys825 checks; actual40000 manifests distribution10012/9994/9986/10008. Native store1211/walk512/Node1763; independent336native+319JS. Actual Chrome callbacks/Web Locks/localStorage/second-context893 checks, not Godot Web-engine gameplay.\nNative manual seed172433723 Warden/no legacy reachedfloor6 normally; turned shore valve, fought south guardian16damage, crossed drained bent pool, toggled island valve, deep water blocked movement/camp return. Fatal relic guardian162damage versus155HP requested confirmation and was cancelled. Restored retreat, process restart preserved state, returned along10 safe cells. No injected stats or position. Web-engine gameplay remains unverified in cloud WebGL-blocklisted browser. Finite layouts and imperfect deep economics remain; random equipment not added this batch. Device-local ranking only, no global backend/account/fees/player uploads. Root homepage only.\n' "$GITHUB_SHA" > export/next/BUILD.txt
      - name: Publish verified game at original homepage only
        run: |
          mkdir -p site-output
          cp -a export/next/. site-output/
          touch site-output/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site-output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy original public homepage
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
