name: Publish verified spatial cart courtyards at original homepage
on:
  push:
    branches: ['pages/playtest']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: magic-tower-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install checksum-verified official Godot and single-thread Web template
        shell: bash
        run: |
          set -euo pipefail
          fetch_asset() {
            if ! curl --fail --location --connect-timeout 20 --max-time 300 --retry 2 -H 'Accept: application/octet-stream' -o "$2" "https://api.github.com/repos/godotengine/godot-builds/releases/assets/$1"; then
              curl --fail --location --connect-timeout 20 --max-time 300 --retry 2 -o "$2" "$3"
            fi
          }
          fetch_asset 425484901 /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          echo 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo 'GODOT_BIN=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64' >> "$GITHUB_ENV"
          fetch_asset 425482597 /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          echo '3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8  /tmp/templates.tpz' | sha256sum --check
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -p /tmp/templates.tpz templates/web_nothreads_release.zip > "$HOME/.local/share/godot/export_templates/4.6.3.stable/web_nothreads_release.zip"
      - name: Verify and export spatial cart courtyard release
        run: |
          bash tools/test_all.sh
          mkdir -p export/next
          "$GODOT_BIN" --headless --path . --export-release 'Web Single Thread' export/next/index.html
          cp assets/fonts/LICENSE-OFL.txt export/next/FONT-LICENSE.txt
          "$GODOT_BIN" --headless --path . --script tools/export_license.gd -- export/next/GODOT-LICENSES.txt
          printf 'Magic Tower verified spatial cart courtyard release\nGame source: 1326d14053678b1af3728861a6112fece30e30ad\nWeb deployment source: %s\nFinal core 283e2fc26462911404efdeecd1b2fdcbdb5891388a9b7eeb818a2b9b29260023. At most two early stone-cart courtyards: physical pushing, visible socket/gate wiring, free reset before shared exclusive reward claim, no respawn or duplicate bounty. Supply tools versus guarded capped relic, capacity and zero-gain preservation. Native seed1165695190 played normally from floor1 to5; exact129 damage, reset, re-selection, cancel/claim and actual process restart restored state. Independent122 maps,33 spatial states per variant,127 resource checks,4164 native store checks,12 legal100-floor policies,107 Godot suites plus Node and cart contract gate passed. Real Chrome storage595 checks passed, NOT Godot Web-engine gameplay.\nExplicit N new journey required for v19; old1-18 rules frozen. Event is finite early content, not a solution to deep repetition or economic inflation. Classic hero/reincarnation systems remain separate. Device-local rankings only; no global backend/account/fee/player uploads. Godot Web-engine gameplay remains unverified in cloud WebGL-blocklisted browser. Root homepage only.\n' "$GITHUB_SHA" > export/next/BUILD.txt
      - name: Publish verified game at original homepage only
        run: |
          mkdir -p site-output
          cp -a export/next/. site-output/
          touch site-output/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site-output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy original public homepage
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
