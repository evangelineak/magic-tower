name: Publish verified endless talents and reincarnation at original homepage
on:
  push:
    branches: ['pages/playtest']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: magic-tower-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install checksum-verified official Godot and single-thread Web template
        shell: bash
        run: |
          set -euo pipefail
          fetch_asset() {
            if ! curl --fail --location --connect-timeout 20 --max-time 300 --retry 2 -H 'Accept: application/octet-stream' -o "$2" "https://api.github.com/repos/godotengine/godot-builds/releases/assets/$1"; then
              curl --fail --location --connect-timeout 20 --max-time 300 --retry 2 -o "$2" "$3"
            fi
          }
          fetch_asset 425484901 /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          echo 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo 'GODOT_BIN=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64' >> "$GITHUB_ENV"
          fetch_asset 425482597 /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          echo '3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8  /tmp/templates.tpz' | sha256sum --check
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -p /tmp/templates.tpz templates/web_nothreads_release.zip > "$HOME/.local/share/godot/export_templates/4.6.3.stable/web_nothreads_release.zip"
      - name: Verify and export talents and reincarnation release
        run: |
          bash tools/test_all.sh
          mkdir -p export/next
          "$GODOT_BIN" --headless --path . --export-release 'Web Single Thread' export/next/index.html
          cp assets/fonts/LICENSE-OFL.txt export/next/FONT-LICENSE.txt
          "$GODOT_BIN" --headless --path . --script tools/export_license.gd -- export/next/GODOT-LICENSES.txt
          printf 'Magic Tower verified endless talents and reincarnation release\nGame source: da8be9694ede1067957ef64c795eef70fe61ed47\nWeb deployment source: %s\nFinal world 06a0d488c58b5fc15eda29b2c4f603292c8cb5576f47ecb55a29c4987e023bf8; combat 8dfa1e7280e6251459888811905f4a1c1b1800a5c8f4f40b62d253fb20063226. Nine seeded talent cards in three disjoint drafts at3/8/15 surviving kills; explicit irreversible selection, no paid draws. Atomic hero-plus-legacy start. First-time depth milestones3/8/15/30/50 grant5 device-local points total on death or retirement; Kit/Coin/Mind unlock costs1/2/2, one starting exchange slot, no unlimited permanent stat stacking. Atomic profile, finished run and receipt commit prevents repeat awards. Old rules1-20 frozen; explicit N required for new21.\nFull114 Godot suites plus Node and cart gate passed. Independent57384 combat cases/989323 assertions,24 legal sixteen-floor runs/7920 checks,12 legal hundred-floor policies. Native store1120/walk459/Node1550; independent323native+82JS. Actual Chrome production callback/Web Locks/localStorage/second-context794 checks passed, NOT Godot Web-engine gameplay.\nNative manual seed1186396894 reachedfloor3 and threekills, selected Alert, retired for1point, process restart still1; unlocked Kit and started Ranger seed374716464 withfocus1 and ward1/pierce1. No fake state injection for this playthrough. Old20 history awarded no points. Native visuals read; full Godot Web-engine gameplay remains unverified in cloud WebGL-blocklisted browser. Deep-floor economics and hero balance remain imperfect. Device-local ranking only, no global backend/account/fee/player uploads. Root homepage only.\n' "$GITHUB_SHA" > export/next/BUILD.txt
      - name: Publish verified game at original homepage only
        run: |
          mkdir -p site-output
          cp -a export/next/. site-output/
          touch site-output/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site-output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy original public homepage
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
