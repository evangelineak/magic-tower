name: Publish verified three-hero journey at original homepage
on:
  push:
    branches: ['pages/playtest']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: magic-tower-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install checksum-verified official Godot and single-thread Web template
        shell: bash
        run: |
          set -euo pipefail
          fetch_asset() {
            if ! curl --fail --location --connect-timeout 20 --max-time 300 --retry 2 -H 'Accept: application/octet-stream' -o "$2" "https://api.github.com/repos/godotengine/godot-builds/releases/assets/$1"; then
              curl --fail --location --connect-timeout 20 --max-time 300 --retry 2 -o "$2" "$3"
            fi
          }
          fetch_asset 425484901 /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          echo 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo 'GODOT_BIN=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64' >> "$GITHUB_ENV"
          fetch_asset 425482597 /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          echo '3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8  /tmp/templates.tpz' | sha256sum --check
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -p /tmp/templates.tpz templates/web_nothreads_release.zip > "$HOME/.local/share/godot/export_templates/4.6.3.stable/web_nothreads_release.zip"
      - name: Verify and export three-hero journey release
        run: |
          bash tools/test_all.sh
          mkdir -p export/next
          "$GODOT_BIN" --headless --path . --export-release 'Web Single Thread' export/next/index.html
          cp assets/fonts/LICENSE-OFL.txt export/next/FONT-LICENSE.txt
          "$GODOT_BIN" --headless --path . --script tools/export_license.gd -- export/next/GODOT-LICENSES.txt
          printf 'Magic Tower verified three-hero endless release\nGame source: dfa857a11c17479752ffa2c96db40ded0c036d46\nWeb deployment source: %s\nFinal world d84f1a594ff233baf2521c9185c08224258acc3b6eb995a5e078894d1c1d81be; combat 3c25e29c4b6b003829e127eb683f31f738a7cacc4dbedcbb75c8075fb38b677c. Atomic hero-selection start preserves old journey until confirmed. Warden blocks half of first two active attacks after fixed reductions, Ranger ignores8 defense, Scholar heals actual up to24 outside battle. Finite focus2/cap3, new maximum floors4/8/12 restore1 with overflow lost; revisits cannot recharge. Original flat distinct hero silhouettes.\nNative all three heroes played: Warden actual8 damage, Ranger actual10, Scholar24 and capped7 heal, full-health refusal, actual process restart and fatal confirmation/settlement verified. Final110 Godot suites plus Node/cart gate passed; independent59400 combat cases,764524 assertions,84 route fixtures and9 legal first-floor journeys; core12 and independent24 legal100-floor policies passed. Actual Chrome production storage699 checks passed, NOT Godot Web-engine gameplay.\nExplicit N new journey required for v20; old1-19 rules frozen. No endless talent drafts or reincarnation yet; planned separately. Hero balance and late-game economic surplus remain imperfect. Device-local rankings only, no global backend/account/fee/player uploads. Godot Web-engine gameplay remains unverified in cloud WebGL-blocklisted browser. Root homepage only.\n' "$GITHUB_SHA" > export/next/BUILD.txt
      - name: Publish verified game at original homepage only
        run: |
          mkdir -p site-output
          cp -a export/next/. site-output/
          touch site-output/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site-output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy original public homepage
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
